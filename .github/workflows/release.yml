name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install zip (Windows release archives)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cross-compile needs OpenTUI native packages for every OS/CPU we ship.
      # Windows is cross-compiled from Linux (Bun-documented); not a separate windows-latest
      # runner — same approach as Bun's own --target=bun-windows-x64 examples.
      - name: Install OpenTUI natives for all targets
        run: |
          CORE_VERSION=$(bun -e 'console.log(require("./package.json").dependencies["@opentui/core"])')
          bun install --os="*" --cpu="*" "@opentui/core@${CORE_VERSION}"

      - name: Build all release binaries + archives + checksums
        run: bun run build:release

      - name: Spot-check native linux-x64 binary
        run: |
          ./dist/mongoscope-linux-amd64 --version
          test "$(./dist/mongoscope-linux-amd64 --version | tr -d '\r')" = "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/release/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag
