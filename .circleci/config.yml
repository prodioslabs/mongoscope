version: 2.1

executors:
  linux-bun:
    docker:
      - image: oven/bun:1.3.11
    environment:
      GH_CLI_VERSION: '2.74.0'

commands:
  ensure-git:
    description: oven/bun images omit git; CircleCI checkout requires it
    steps:
      - run:
          name: Ensure git is installed
          command: |
            set -euo pipefail
            if command -v git >/dev/null 2>&1; then
              exit 0
            fi
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git openssh-client

  checkout-full:
    description: Checkout with full git history and tags
    steps:
      - ensure-git
      - checkout
      - run:
          name: Fetch full git history and tags
          command: |
            git config --global --add safe.directory "$(pwd)"
            if git rev-parse --is-shallow-repository | grep -q true; then
              git fetch --unshallow --tags --force
            else
              git fetch --tags --force
            fi

  install-release-tools:
    description: Install zip and a pinned GitHub CLI for publishing
    steps:
      - run:
          name: Install zip and GitHub CLI
          command: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl zip
            curl -fsSL \
              "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
              -o /tmp/gh.tar.gz
            tar -xzf /tmp/gh.tar.gz -C /tmp
            install -m 755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            gh --version
            zip -v | head -n 1

jobs:
  ci:
    executor: linux-bun
    steps:
      - ensure-git
      - checkout
      - run:
          name: Install root dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Typecheck
          command: bun run typecheck
      - run:
          name: Lint
          command: bunx oxlint
      - run:
          name: Test
          command: bun run test
      - run:
          name: Install docs dependencies
          command: bun install --frozen-lockfile
          working_directory: docs
      - run:
          name: Docs typecheck
          command: bun run types:check
          working_directory: docs

  release:
    executor: linux-bun
    resource_class: large
    steps:
      - checkout-full
      - install-release-tools
      - run:
          name: Validate tag
          command: |
            set -euo pipefail
            tag="${CIRCLE_TAG:-<< pipeline.git.tag >>}"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Invalid release tag: $tag"
              echo "Expected SemVer like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
      - run:
          name: Require GITHUB_TOKEN
          command: |
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "GITHUB_TOKEN is not set."
              echo "Add it in CircleCI Project Settings → Environment Variables."
              echo "It needs permission to create releases on prodioslabs/mongoscope."
              exit 1
            fi
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      # Cross-compile embeds OpenTUI natives for every OS/CPU we ship; install them all.
      - run:
          name: Install OpenTUI natives for all targets
          command: |
            set -euo pipefail
            CORE_VERSION=$(bun -e 'console.log(require("./package.json").dependencies["@opentui/core"])')
            bun install --os="*" --cpu="*" "@opentui/core@${CORE_VERSION}"
      - run:
          name: Build all release binaries + archives + checksums
          command: bun run build:release
      # Binary embeds package.json version at compile time; must equal the tag without the leading v.
      - run:
          name: Spot-check native linux-x64 binary
          command: |
            set -euo pipefail
            tag="${CIRCLE_TAG:-<< pipeline.git.tag >>}"
            expected="${tag#v}"
            ./dist/mongoscope-linux-amd64 --version
            actual="$(./dist/mongoscope-linux-amd64 --version | tr -d '\r')"
            if [ "$actual" != "$expected" ]; then
              echo "Version mismatch: binary printed '$actual', expected '$expected' from tag '$tag'"
              exit 1
            fi
      - run:
          name: Publish GitHub Release
          command: |
            set -euo pipefail
            tag="${CIRCLE_TAG:-<< pipeline.git.tag >>}"
            rm -rf dist/release/staging
            # Hyphenated tags (e.g. v1.2.3-rc.1) must not become GitHub's "latest".
            prerelease_flag=
            case "$tag" in
              *-*)
                prerelease_flag=--prerelease
                echo "Tag contains a hyphen; publishing as a prerelease."
                ;;
            esac
            gh release create "$tag" dist/release/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              ${prerelease_flag}

workflows:
  ci:
    when: pipeline.git.tag == ""
    jobs:
      - ci:
          filters:
            tags:
              ignore: /.*/

  release:
    when: pipeline.git.tag starts-with "v"
    jobs:
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/
